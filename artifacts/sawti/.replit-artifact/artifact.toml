kind = "web"
previewPath = "/"
title = "صوتي - Voice Collection"
version = "1.0.0"
id = "artifacts/sawti"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22671

[services.development]
run = "pnpm --filter @workspace/sawti run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sawti", "run", "build" ]
publicDir = "artifacts/sawti/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22671"
BASE_PATH = "/"
